{% extends "base.html" %}
{% block title %}Register as driver — TFA Shuttles{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-3">Register as driver</h3>

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST" action="{{ url_for('register_driver') }}">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-control" type="text" id="username"
                               name="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="name">Full name</label>
                        <input class="form-control" type="text" id="name"
                               name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" type="password" id="password"
                               name="password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="license_plate">
                            License plate
                        </label>
                        <input class="form-control" type="text" id="license_plate"
                               name="license_plate" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">
                        Register driver
                    </button>
                </form>

                <p class="text-center mt-3 mb-0 small">
                    Already registered?
                    <a href="{{ url_for('login') }}">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
