{% extends "base.html" %}
{% block title %}Change Password — TFA Shuttles{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-3">Change Password</h3>

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                {% if success %}
                    <div class="alert alert-success">{{ success }}</div>
                {% endif %}

                <form method="POST" action="{{ url_for('change_password') }}">
                    <div class="mb-3">
                        <label class="form-label" for="current_password">Current password</label>
                        <input class="form-control" type="password" id="current_password"
                               name="current_password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="new_password">New password</label>
                        <input class="form-control" type="password" id="new_password"
                               name="new_password" minlength="8" required>
                        <div class="form-text">Minimum 8 characters.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirm_password">Confirm new password</label>
                        <input class="form-control" type="password" id="confirm_password"
                               name="confirm_password" minlength="8" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Update password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
